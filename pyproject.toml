[build-system]
requires = ["setuptools >= 64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma_retargeter"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/**/*.txt"]
requires-python = ">=3.12"
dependencies = [
    "newton==1.3.0",
    "warp-lang>=1.14.0",
    "typing_extensions==4.15.0",
    "pyglet==2.1.13",
    "numpy==2.4.3",
    "trimesh>=4.6.8",
    "pycollada>=0.9",
    "imgui-bundle==1.92.4",
    "usd-core==26.3",
    "scipy==1.17.1",
    "tqdm==4.67.3",
    "defusedxml>=0.7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["soma_retargeter*"]
exclude = ["app*", "assets*"]

[tool.setuptools.package-data]
soma_retargeter = ["assets/**/*.json", "assets/**/*.bvh", "assets/**/*.usd", "assets/robotics/**/*"]

[tool.setuptools.dynamic]
version = { attr = "soma_retargeter.__version__" }

[tool.uv]
managed = true
